<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">One card, three jobs</title>
  <desc id="wf-desc">Front shows the word only; back grades known or unknown; the wage strip accrues today's pay.</desc>

  <defs>
    <clipPath id="wf-stage">
      <rect width="1200" height="360" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#wf-stage)">
    <rect width="1200" height="360" fill="#E8E0D0"/>

    <g fill="#C9BBA8" opacity="0.35">
      <rect x="70" y="86" width="36" height="28" rx="5"/>
      <rect x="118" y="86" width="36" height="28" rx="5"/>
      <rect x="454" y="86" width="36" height="28" rx="5"/>
      <rect x="838" y="86" width="36" height="28" rx="5"/>
      <rect x="886" y="86" width="36" height="28" rx="5"/>
    </g>

    <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" fill="#1C1C1C">
      <g id="face-front" transform="translate(48, 40)">
        <text x="0" y="0" fill="#6F675E" font-size="18" letter-spacing="1.6">正面</text>
        <text x="0" y="92" font-size="32" font-weight="700">abandon</text>
        <text x="0" y="128" fill="#3A3A3A" font-size="20">/əˈbændən/</text>
        <text x="0" y="250" fill="#6F675E" font-size="18">词在，译文不在</text>
      </g>

      <g id="face-back" transform="translate(430, 40)">
        <text x="0" y="0" fill="#6F675E" font-size="18" letter-spacing="1.6">反面</text>
        <text x="0" y="78" font-size="28" font-weight="700">abandon</text>
        <text x="0" y="114" font-size="22">放弃；抛弃</text>
        <g transform="translate(0, 148)">
          <rect width="88" height="36" rx="6" fill="#FFFFFF" fill-opacity="0.35"/>
          <rect x="100" width="110" height="36" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>
          <text x="44" y="25" text-anchor="middle" font-size="18">认识</text>
          <text x="155" y="25" text-anchor="middle" font-size="18">不认识</text>
        </g>
        <text x="0" y="250" fill="#6F675E" font-size="18">收满每日目标再轮换</text>
      </g>

      <g id="loaf-strip" transform="translate(840, 40)">
        <text x="0" y="0" fill="#6F675E" font-size="18" letter-spacing="1.6">薪条</text>
        <text x="0" y="108" font-size="22">你已摸鱼</text>
        <text x="0" y="144" font-size="28" font-weight="700">CNY￥22.22</text>
        <text x="0" y="250" fill="#6F675E" font-size="18">不是第三张卡</text>
      </g>
    </g>
  </g>
</svg>
