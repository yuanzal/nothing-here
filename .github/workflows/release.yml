name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: python -m PyInstaller scripts/nothing_here.spec --noconfirm --clean

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/NothingHere/* -DestinationPath dist/NothingHere-win64.zip -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NothingHere-win64.zip
          generate_release_notes: true
